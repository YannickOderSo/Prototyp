name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Lint, Typen, Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cockpit
          POSTGRES_PASSWORD: cockpit
          POSTGRES_DB: cockpit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cockpit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.21
        ports: ["1025:1025", "8025:8025"]
    env:
      DATABASE_URL: postgres://cockpit:cockpit@localhost:5432/cockpit
      MAILPIT_URL: http://localhost:8025
      MAILPIT_SMTP_HOST: localhost
      MAILPIT_SMTP_PORT: "1025"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Abhängigkeiten
        run: uv sync --frozen
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy (connectors, dunning, capture)
        run: uv run mypy connectors dunning capture
      - name: Migrationen vollständig
        run: uv run python manage.py makemigrations --check --dry-run --settings=cockpit.settings_test
      - name: Systemcheck Produktion
        env:
          DJANGO_SECRET_KEY: ci-nur-fuer-check-kein-geheimnis-aber-lang-genug-1234567890
          COCKPIT_FERNET_KEYS: Q0ktbnVyLWZ1ZXItQ2hlY2tzLWtlaW4tR2VoZWltbmlz
          DJANGO_ALLOWED_HOSTS: cockpit.example
          # cockpit.W001 (Platzhalter-Rechtstexte) bleibt bis zur Lieferung durch das Team offen (Pruefliste-Team.md)
          COCKPIT_CHECKS_STUMM: cockpit.W001
        run: uv run python manage.py check --deploy --fail-level WARNING
      - name: Tests mit Abdeckung
        run: uv run pytest -m "not e2e" --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Abdeckung dunning und capture/rules mindestens 90 Prozent
        run: uv run python scripts/abdeckung_pruefen.py

  e2e:
    name: Playwright (390 x 844)
    runs-on: ubuntu-latest
    needs: pruefen
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cockpit
          POSTGRES_PASSWORD: cockpit
          POSTGRES_DB: cockpit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cockpit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cockpit:cockpit@localhost:5432/cockpit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - name: Chromium installieren
        run: uv run playwright install --with-deps chromium
      - name: Playwright-Tests
        run: uv run python scripts/e2e_starten.py

  docker:
    name: Docker-Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t cockpit:ci .
      - name: Läuft ohne Root
        run: test "$(docker run --rm --entrypoint id cockpit:ci -u)" != "0"
      - name: Backup-Image bauen (restic >= 0.17, GNU date)
        run: |
          docker build -t cockpit-backup:lokal docker/backup
          docker run --rm cockpit-backup:lokal sh -c 'restic backup --help | grep -q stdin-from-command && date --version >/dev/null'
      - name: Produktions-Stack Smoke-Test (Caddy, App-Rolle, Health, Sicherung, Restore-Probe)
        run: scripts/prod_smoke.sh cockpit:ci
