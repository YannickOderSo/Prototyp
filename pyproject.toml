[project]
name = "cockpit"
version = "0.1.0"
description = "Forderungs- und Abrechnungs-Cockpit als Aufsatz auf Lexware Office"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.11",
    "psycopg[binary]>=3.2",
    "gunicorn>=23.0",
    "whitenoise>=6.7",
    "django-ratelimit>=4.1",
    "cryptography>=43",
    "httpx>=0.27",
    "segno>=1.6",
    "pypdf>=5.0",
    "sentry-sdk>=2.14",
    "anthropic[bedrock]>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "time-machine>=2.15",
    "playwright>=1.48",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv", "staticfiles", "var"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "S101", "DJ001", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S603", "S607", "E501"]
"dunning/texte.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[tool.django-stubs]
django_settings_module = "cockpit.settings_test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "cockpit.settings_test"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "mailpit: Test gegen einen laufenden Mailpit-Server (MAILPIT_URL)",
    "e2e: Playwright-Ende-zu-Ende-Test",
]
filterwarnings = ["ignore::DeprecationWarning:environ.*", "ignore:No directory at:UserWarning"]

[tool.coverage.run]
branch = true
omit = ["*/migrations/*", "tests/*"]
